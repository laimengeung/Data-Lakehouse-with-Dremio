services:
  dremio:
    image: dremio/dremio-oss:latest
    container_name: dremio
    ports:
      - 9047:9047
      - 31010:31010
      - 32010:32010
    volumes:
      - dremio_data:/opt/dremio/data
    networks:
      - iceberg
  
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports: 
      - 19120:19120
    volumes:
      - nessie_data:/var/lib/nessie
    networks:
      - iceberg

  minio:
    container_name: minio
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - 9001:9001
      - 9000:9000
    volumes:
      - minio_data:/data
    networks:
      - iceberg
    command: ["server", "/data", "--console-address", ":9001"]
  
  openmaxio:
    image: ghcr.io/huncrys/minio-console:latest
    container_name: openmaxio
    environment:
      CONSOLE_PBKDF_PASSPHRASE: mySecret
      CONSOLE_PBKDF_SALT: mySalt
      CONSOLE_MINIO_SERVER: http://minio:9000
    ports:
      - 9090:9090
    networks:
      - iceberg

networks:
  iceberg:

volumes:
  dremio_data:
  nessie_data:
  minio_data: